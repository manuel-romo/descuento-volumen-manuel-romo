name: Debug OIDC
on:
  push:
    branches: [debug-oidc]
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Ver claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2)
          P="${P}$(printf '=%.0s' $(seq $(( (4 - ${#P} % 4) % 4 ))))"
          echo "$P" | tr '_-' '/+' | base64 -d | jq '{sub, aud, repository, repository_owner}'